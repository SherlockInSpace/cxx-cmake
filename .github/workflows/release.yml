# Every push to main updates the rolling release pull request with
# CHANGELOG.md and the next version, written into project(VERSION) in
# CMakeLists.txt. Merging it tags vX.Y.Z from that version and creates the
# GitHub Release, which then gets the tag's benchmark results: bench.json and
# bench-data.json, the history the next release pull request compares with.
# Needs the RELEASE_PLEASE_TOKEN secret, see README "Releases".

name: release

on:
  push:
    branches: [main]

# The PAT does all the writing, so the job token stays read-only.
permissions:
  contents: read

# Two pushes in a row must not edit the release pull request at the same
# time, so a run waits for the one in progress to finish.
concurrency:
  group: ${{ github.workflow }}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A pull request or tag created with the workflow's own GITHUB_TOKEN
      # triggers no workflows, so the gate would never run on the release
      # pull request.
      - name: Check RELEASE_PLEASE_TOKEN is set
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::The RELEASE_PLEASE_TOKEN secret is not set. README.md, section Releases, has the one-time setup."
            exit 1
          fi

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  bench:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/_bench.yml
    with:
      image: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.4@sha256:ae3b9849e3d10e0b653453e53c886d50a8d1c04bd5b77a3baf8e7df95b2b285a
      ref: ${{ needs.release-please.outputs.tag_name }}

  bench-assets:
    needs: [release-please, bench]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bench

      # A fresh history with this release as its only entry.
      - uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: googlecpp
          output-file-path: bench.json
          external-data-json-path: bench-data.json
          save-data-file: true

      - name: Attach the results to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" bench.json bench-data.json --clobber
