# The full suite (_full.yml) on every push to main and weekly, in the same
# ci image as the gate. A push to main then publishes the docs and the
# coverage report to Pages; the weekly run hands its result to _weekly.yml,
# which opens or updates the drift issue when it failed.
name: post-merge

on:
  push:
    branches: [main]
  # A change to the suite runs it before it merges.
  pull_request:
    paths:
      - .github/workflows/post-merge.yml
      - .github/workflows/_full.yml
      - .github/workflows/_weekly.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main tests everything the older one did. The weekly run
# has its own group so a push does not cancel it.
concurrency:
  group: post-merge-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    uses: ./.github/workflows/_full.yml
    permissions:
      contents: read
      checks: write
    with:
      image: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.2@sha256:3a4750033b0ed2a6203205804c55bfec005d9079b0f9effc70d310daf4939aba

  # One site from this run's artifacts: the API docs at the root and the
  # coverage report under coverage/. Only a push to main publishes it.
  site:
    needs: full
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs
          path: site

      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: site/coverage

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Separate from the upload: deploy-pages looks the artifact up through the
  # API, which can miss one uploaded seconds earlier in the same job. If a
  # deploy fails, re-run this job only; re-running site too leaves two
  # github-pages artifacts and deploy-pages refuses both.
  pages:
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  weekly:
    needs: full
    if: ${{ always() && github.event_name == 'schedule' }}
    uses: ./.github/workflows/_weekly.yml
    permissions:
      contents: read
      issues: write
    with:
      full-result: ${{ needs.full.result }}
