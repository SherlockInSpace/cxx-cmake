# The full suite (_full.yml) on every push to main and weekly, in the same
# ci image as the gate. The weekly run (or one started by hand) also runs the
# benchmarks (_bench.yml) and hands both results to _weekly.yml, which puts
# the benchmarks on the dashboard and opens the drift issue when something
# failed. A push to main, and a weekly run, publish the docs, the coverage
# report and the dashboard to Pages.
name: post-merge

on:
  push:
    branches: [main]
  # A change to the suite runs it before it merges.
  pull_request:
    paths:
      - .github/workflows/post-merge.yml
      - .github/workflows/_full.yml
      - .github/workflows/_weekly.yml
      - .github/workflows/_bench.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main tests everything the older one did. The weekly run
# has its own group so a push does not cancel it.
concurrency:
  group: post-merge-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    uses: ./.github/workflows/_full.yml
    permissions:
      contents: read
      checks: write
    with:
      image: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.4@sha256:ae3b9849e3d10e0b653453e53c886d50a8d1c04bd5b77a3baf8e7df95b2b285a

  bench:
    if: ${{ github.event_name != 'push' }}
    uses: ./.github/workflows/_bench.yml
    with:
      image: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.4@sha256:ae3b9849e3d10e0b653453e53c886d50a8d1c04bd5b77a3baf8e7df95b2b285a

  # One site from this run's artifacts: the API docs at the root, the coverage
  # report under coverage/ and the benchmark dashboard under bench/. Only main
  # publishes it, after a push or a weekly run.
  site:
    needs: [full, weekly]
    if: >-
      ${{ always() && needs.full.result == 'success' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || needs.weekly.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs
          path: site

      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: site/coverage

      # The dashboard's history lives on gh-pages, which the first weekly run
      # creates; until then there is nothing to add.
      - uses: actions/checkout@v7
        id: history
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Add the benchmark dashboard
        if: ${{ steps.history.outcome == 'success' && hashFiles('gh-pages/bench/index.html') != '' }}
        run: cp -r gh-pages/bench site/bench

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Separate from the upload: deploy-pages looks the artifact up through the
  # API, which can miss one uploaded seconds earlier in the same job. If a
  # deploy fails, re-run this job only; re-running site too leaves two
  # github-pages artifacts and deploy-pages refuses both.
  pages:
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  weekly:
    needs: [full, bench]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/_weekly.yml
    permissions:
      contents: write
      issues: write
    with:
      full-result: ${{ needs.full.result }}
      bench-result: ${{ needs.bench.result }}
