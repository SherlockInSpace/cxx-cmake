# Pull request gate: _gate.yml in the cxx-cmake-container ci image, named by
# version and digest (README "Manual pins" says how to move it). Pushes to
# main run the full suite instead (post-merge.yml).
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/_gate.yml
    permissions:
      contents: read
      checks: write
    with:
      image: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.2@sha256:3a4750033b0ed2a6203205804c55bfec005d9079b0f9effc70d310daf4939aba
