# Pull request gate, in the cxx-cmake-container ci image (named by version and
# digest; README "Manual pins" says how to move it). gcc and clang, Debug and
# Release, build with warnings as errors and run the unit and functional
# tiers, each reported test by test as its own check. clang-format checks the
# layout.
# Pushes to main run the full suite instead (post-merge.yml).
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.compiler }} ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    container: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.1@sha256:82d661ac1fff82cf9da925386fcc4c1c0fcd4808af6685effba1ed709b5bfab1
    # A normal run takes a few minutes. Without a limit a hung job holds the
    # runner for GitHub's six-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [ci-debug, ci-release]
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7

      # Inside the container github.workspace is the host's path, so the
      # cache directory comes from the shell's GITHUB_WORKSPACE.
      - name: Point ccache at the workspace
        run: echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-amd64-${{ matrix.compiler }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-amd64-${{ matrix.compiler }}-${{ matrix.preset }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} -L 'unit|functional'

      - name: ccache statistics
        if: ${{ !cancelled() }}
        run: ccache --show-stats

      - name: Report tests
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: build/${{ matrix.preset }}/junit.xml
          check_name: tests (${{ matrix.compiler }} ${{ matrix.preset }})
          include_passed: true
          detailed_summary: true

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    container: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.1@sha256:82d661ac1fff82cf9da925386fcc4c1c0fcd4808af6685effba1ed709b5bfab1
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The checkout belongs to the runner's user and the container runs as
      # root, so git needs telling that the directory is safe.
      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          clang-format --dry-run -Werror $(git ls-files 'src/*.cpp' 'inc/util/bit.hpp' 'inc/util/bloom.hpp' 'test/*.cpp' 'bench/*.cpp')
