# Pull request gate: _gate.yml in the cxx-cmake-container ci image, named by
# version and digest (README "Manual pins" says how to move it). Pushes to
# main run the full suite instead (post-merge.yml).
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/_gate.yml
    permissions:
      contents: read
      checks: write
    with:
      image: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.3@sha256:2a3860c0a99d32e3edb922999a67f444eb2451fab3ca35869ecd7e1318a269c7
