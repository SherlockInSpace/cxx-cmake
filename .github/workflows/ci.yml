# Minimal build-and-test gate for pull requests and pushes to the integration
# branches, in the cxx-cmake-container ci image. The image is named by version
# and digest; README "Manual pins" says how to move it.
name: ci

on:
  pull_request:
    branches: [library, main]
  push:
    branches: [library, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-24.04
    container: ghcr.io/sherlockinspace/cxx-cmake-container/ci:0.1.1@sha256:82d661ac1fff82cf9da925386fcc4c1c0fcd4808af6685effba1ed709b5bfab1
    # A normal run takes a minute or two. Without a limit a hung job holds the
    # runner for GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configure, build and test (warnings are errors)
        run: cmake --workflow --preset ci-debug
