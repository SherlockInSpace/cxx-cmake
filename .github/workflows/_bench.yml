# Runs the performance tier in the image: the benchmarks (the bench workflow
# preset), left as the bench artifact, one Google Benchmark JSON file with
# every benchmark, and the Tracy harness (the profile preset), whose trace
# tracy-capture can record as the tracy artifact. The caller decides what to compare it with: the
# dashboard on a weekly run or a perf-labelled pull request, the last release
# on a release pull request.
name: bench

on:
  workflow_call:
    inputs:
      image:
        description: cxx-cmake-container ci image, by version and digest
        required: true
        type: string
      ref:
        description: commit or tag to benchmark (default the event's)
        type: string
        default: ""
      capture:
        description: record a Tracy trace of the harness as the tracy artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bench:
    name: benchmarks
    runs-on: ubuntu-24.04
    container: ${{ inputs.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Build and run the benchmarks
        run: cmake --workflow --preset bench

      # One file per bench/src source; the reporting action reads one.
      - name: Merge the results
        run: |
          python3 - build/bench/bench/results bench.json <<'EOF'
          import glob, json, sys
          files = sorted(glob.glob(f"{sys.argv[1]}/*.json"))
          if not files:
              sys.exit("no benchmark results")
          runs = [json.load(open(f)) for f in files]
          merged = {"context": runs[0]["context"],
                    "benchmarks": [b for r in runs for b in r["benchmarks"]]}
          json.dump(merged, open(sys.argv[2], "w"), indent=1)
          print(f"{len(merged['benchmarks'])} benchmarks from {len(files)} files")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: bench
          path: bench.json
          retention-days: 30

  # The Tracy harness in bench/profile/ builds and runs once without a
  # profiler, which proves it still works; docs/profiling.md shows how to
  # attach one.
  profile:
    name: profiling harness
    runs-on: ubuntu-24.04
    container: ${{ inputs.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Build and run the profiling harness
        run: cmake --workflow --preset profile

      # tracy-capture connects to the harness on localhost and writes the
      # trace when the harness ends; TRACY_NO_EXIT keeps the harness alive
      # until every event has gone over. The timeouts stop a run that never
      # connects. Sampling needs perf events, which a container doesn't get,
      # so the trace has the harness's zones and plots only.
      - name: Capture a trace
        if: ${{ inputs.capture }}
        run: |
          timeout 300 tracy-capture -a 127.0.0.1 -o util.tracy -f &
          capture=$!
          TRACY_NO_EXIT=1 timeout 300 build/profile/bench/profile/util_profile
          wait "$capture"
          test -s util.tracy
          ls -l util.tracy

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.capture }}
        with:
          name: tracy
          path: util.tracy
          retention-days: 30
