# Dependabot refreshes the actions in .github/workflows. The two pins it
# cannot see, the container image digest and cmake/CPM.cmake, are bumped by
# hand (README.md, "Manual pins"). The prefix is there because the gate lints
# every commit as a Conventional Commit.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
