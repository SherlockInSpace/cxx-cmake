# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/C++.gitlab-ci.yml

# use the official gcc image, based on debian
# can use versions as well, like gcc:5.2
# see https://hub.docker.com/_/gcc/

image: registry.gitlab.com/sherlockinspace/cxx-cmake-container:latest

build:
  stage: build
  # instead of calling g++ directly you can also use some build toolkit like make
  # install the necessary build tools when needed
  # before_script:
  #   - apt update && apt -y install make autoconf
  script:
    - rm -fr build
    - mkdir build
    - pushd build
    - cmake -DBUILD_DOC=ON -DBUILD_TEST=UNIT -DTEST_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug -GNinja ../
    - ninja -j$(nproc)
  artifacts:
    paths:
      - build/
      # depending on your build setup it's most likely a good idea to cache outputs to reduce the build time
      # cache:
      #   paths:
      #     - "*.o"

# run tests using the binary built before
test:
  stage: test
  dependencies:
    - build
  script:
    - pushd build
    - ctest --output-junit test-results.xml
  artifacts:
    when: always
    reports:
        junit: build/test-results.xml

coverage:
  stage: test
  dependencies:
    - build
  script:
    - pushd build
    - ninja bit_tests_coverage
    - ninja thread_pool_tests_coverage
    - ninja bloom_tests_coverage
  coverage: /^\s*lines:\s*\d+.\d+\%/
  artifacts:
    name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
    expire_in: 2 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/*tests_coverage.xml

